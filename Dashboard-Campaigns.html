<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pmenu — الحملات التسويقية</title>
<link rel="icon" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
a{color:#FF5E13}a:hover{color:#FF7A3D}
@keyframes pm-glow{0%,100%{box-shadow:0 0 0 0 rgba(255,94,19,.45)}50%{box-shadow:0 0 0 8px rgba(255,94,19,0)}}
.pm-glow{animation:pm-glow 1.8s ease-out infinite}

<body class="is-page">
<template id="tpl-main">
<div dir="rtl" style="font-family: 'Readex Pro', sans-serif; color: #16140F; background: radial-gradient(1100px 520px at 90% -8%, rgba(255,94,19,.14), rgba(255,94,19,0) 60%), radial-gradient(700px 420px at 0% 100%, rgba(255,94,19,.06), rgba(255,94,19,0) 60%), #F6F4EF; min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch">
  <div style="flex: 1 1 240px; max-width: 272px"><div data-import="Sidebar" data-props='{"active": "campaigns"}'></div></div>

  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
      <div>
        <h1 style="margin: 0; font-size: 34px; font-weight: 600">الحملات التسويقية</h1>
        <p style="margin: 6px 0 0; color: #6B675E; font-weight: 300">ارفع مبيعات أي صنف من داخل المنيو نفسه، وشوف النتيجة بالأرقام</p>
      </div>
      <button type="button" style="padding: 12px 22px; border-radius: 999px; border: 0; background: #FF5E13; color: #0A0A0A; font: inherit; font-weight: 700; cursor: pointer">+ حملة جديدة</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px">
      <template data-for="{{types}}" data-as="t">
        <button type="button" onClick="{{t.pick}}" style="text-align: right; padding: 18px; border-radius: 22px; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 10px; background: {{t.bg}}; color: {{t.fg}}; border: 1px solid {{t.border}}; box-shadow: 0 1px 2px rgba(22,20,15,.04), 0 18px 40px -22px rgba(22,20,15,.2)">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: {{t.iconBg}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.iconFg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>
          <strong style="font-size: 16px; font-weight: 600">{{t.name}}</strong>
          <span style="font-size: 13px; line-height: 1.6; opacity: .75">{{t.desc}}</span>
        </button>
      </template>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
      <section style="flex: 1.3 1 420px; min-width: 0; padding: 26px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(22,20,15,.07); box-shadow: 0 1px 2px rgba(22,20,15,.04), 0 18px 40px -18px rgba(22,20,15,.16); display: flex; flex-direction: column; gap: 18px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #6B675E">حملة شغّالة</span><h2 style="margin: 0; font-size: 22px; font-weight: 600">{{c.title}}</h2></div>
          <span class="pm-glow" style="padding: 8px 14px; border-radius: 999px; background: rgba(255,94,19,.12); color: #C2410C; font-size: 13px; font-weight: 600">{{c.left}}</span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <template data-for="{{c.kpis}}" data-as="k">
            <div style="padding: 16px; border-radius: 18px; background: #F6F4EF; display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 12px; color: #6B675E">{{k.t}}</span>
              <strong style="font-family: 'Poppins', sans-serif; font-size: 26px; color: {{k.c}}" dir="ltr">{{k.v}}</strong>
            </div>
          </template>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 14px; color: #3D3A33">الطلبات اليومية: قبل الحملة وبعدها</span>
          <div style="height: 170px; display: flex; align-items: flex-end; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(22,20,15,.08)">
            <template data-for="{{c.bars}}" data-as="b">
              <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end">
                <span style="font-size: 11px; color: #6B675E">{{b.v}}</span>
                <div style="width: 100%; max-width: 34px; border-radius: 8px 8px 3px 3px; background: {{b.c}}; height: {{b.h}}"></div>
              </div>
            </template>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6B675E"><span>قبل الحملة</span><span style="color: #C2410C; font-weight: 600">بعد إطلاق الحملة ←</span></div>
        </div>

        <div style="padding: 16px; border-radius: 18px; background: #16140F; color: #F6F4EF; display: flex; gap: 12px; align-items: flex-start">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF5E13" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
          <span style="font-size: 14px; line-height: 1.7">{{c.tip}}</span>
        </div>
      </section>

      <section style="flex: 0 1 330px; display: flex; flex-direction: column; align-items: center; gap: 12px">
        <span style="font-size: 14px; color: #6B675E">كذا يشوفها العميل في المنيو</span>
        <div style="width: 300px; height: 600px; border-radius: 46px; background: #0A0A0A; padding: 9px; box-sizing: border-box; box-shadow: 0 40px 80px -30px rgba(22,20,15,.45)">
          <div style="width: 100%; height: 100%; border-radius: 37px; overflow: hidden; background: #F4F1EA; display: flex; flex-direction: column; gap: 10px">
            <div style="padding: 22px 16px 14px; background: #054026"><img src="assets/wordmark-cream.svg" alt="وِكاد" style="height: 26px; width: auto"></div>
            <template data-if="{{c.banner}}">
              <div style="margin: 0 12px; padding: 10px 12px; border-radius: 14px; background: #FF5E13; color: #0A0A0A; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600"><span>{{c.banner}}</span><span dir="ltr" style="font-family: 'Poppins', sans-serif">{{c.timer}}</span></div>
            </template>
            <div style="margin: 0 12px; position: relative; height: 150px; border-radius: 18px; overflow: hidden; box-shadow: {{c.heroRing}}">
              <img src="{{c.heroImg}}" alt="" style="width: 100%; height: 100%; object-fit: cover; filter: saturate(1.15)">
              <div style="position: absolute; inset: 0; padding: 12px 14px; display: flex; flex-direction: column; justify-content: flex-end; background: linear-gradient(90deg, rgba(5,64,38,0) 25%, rgba(5,64,38,.92)); color: #EDE6DA">
                <span style="align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: #FF5E13; color: #0A0A0A; font-size: 11px; font-weight: 700">{{c.badge}}</span>
                <strong style="font-size: 17px">{{c.heroName}}</strong>
                <div style="display: flex; gap: 8px; align-items: baseline"><strong style="font-family: 'Poppins', sans-serif; font-size: 16px">{{c.price}}</strong><template data-if="{{c.oldPrice}}"><s style="font-size: 12px; opacity: .7">{{c.oldPrice}}</s></template></div>
              </div>
            </div>
            <template data-if="{{c.pair}}">
              <div style="margin: 0 12px; padding: 10px; border-radius: 16px; background: #FFFFFF; border: 2px dashed #FF5E13; display: flex; align-items: center; gap: 10px">
                <img src="assets/mango-cheesecake.jpg" alt="" style="width: 48px; height: 48px; border-radius: 10px; object-fit: cover">
                <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; font-size: 12px"><strong style="font-size: 13px">يطلع معه حلو؟</strong><span style="color: #6B675E">تشيز كيك المانجو بـ٢٢ بدل ٢٦</span></div>
                <span style="padding: 6px 10px; border-radius: 999px; background: #054026; color: #fff; font-size: 12px">أضف</span>
              </div>
            </template>
            <div style="margin: 0 12px; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; background: #FFFFFF">
              <img src="assets/iced-black.jpg" alt="" style="width: 46px; height: 46px; border-radius: 10px; object-fit: cover">
              <span style="flex: 1 1 auto; font-size: 13px">آيس أمريكانو</span><strong style="font-family: 'Poppins', sans-serif; color: #0A6B41">16</strong>
            </div>
            <div style="margin: 0 12px; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; background: #FFFFFF">
              <img src="assets/iced-coffee.jpg" alt="" style="width: 46px; height: 46px; border-radius: 10px; object-fit: cover">
              <span style="flex: 1 1 auto; font-size: 13px">قهوة اليوم الباردة</span><strong style="font-family: 'Poppins', sans-serif; color: #0A6B41">19</strong>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>
</template>
<template id="tpl-Sidebar">
<nav dir="rtl" aria-label="لوحة التحكم" style="font-family: 'Readex Pro', sans-serif; color: #16140F; background: #FFFFFF; width: 100%; min-height: 1000px; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; border-left: 1px solid rgba(22,20,15,.07)">
  <a href="site.html" dir="ltr" style="align-self: flex-end; padding: 0 10px 20px; font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 26px; color: #16140F; text-decoration: none"><span style="color: #FF5E13">P</span>menu</a>
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #F6F4EF; border: 1px solid rgba(22,20,15,.07); margin-bottom: 14px">
    <div style="width: 38px; height: 38px; border-radius: 11px; background: #054026; display: flex; align-items: center; justify-content: center; flex: none"><img src="assets/wordmark-cream.svg" alt="" style="width: 26px; height: auto"></div>
    <div style="display: flex; flex-direction: column; min-width: 0"><strong style="font-size: 15px; font-weight: 600">وِكاد</strong><span style="font-size: 12px; color: #6B675E">٣ فروع · الباقة الفخمة</span></div>
  </div>
  <template data-for="{{items}}" data-as="it">
    <a href="{{it.href}}" style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 14px; text-decoration: none; font-size: 15px; background: {{it.bg}}; color: {{it.fg}}; font-weight: {{it.fw}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
      <span style="flex: 1 1 auto">{{it.label}}</span>
      <template data-if="{{it.badge}}"><span style="padding: 2px 8px; border-radius: 999px; background: #FF5E13; color: #0A0A0A; font-size: 11px; font-weight: 700">{{it.badge}}</span></template>
    </a>
  </template>
  <div style="margin-top: 28px; position: relative; overflow: hidden; padding: 18px; border-radius: 20px; background: #E8467C; color: #fff; display: flex; flex-direction: column; gap: 8px">
    <div aria-hidden="true" style="position: absolute; top: -30px; left: -30px; width: 100px; height: 100px; border-radius: 50%; border: 1px solid rgba(255,255,255,.45)"></div>
    <span style="font-size: 12px; opacity: .9">Season Drop</span>
    <strong style="font-size: 17px">أكتوبر الوردي مفعّل</strong>
    <span style="font-size: 13px; line-height: 1.6">يرجع ثيمك تلقائياً ١ نوفمبر</span>
  </div>
</nav>
</template>
<div class="demo-badge" role="note"><i aria-hidden="true"></i><span class="db-long">عرض تجريبي وتخيّلي فقط</span><span class="db-short">عرض تجريبي</span></div>
<div id="app"></div>
<nav class="demo-nav" aria-label="تنقل العرض">
  <a href="index.html" class="demo-brand" dir="ltr"><span>P</span>menu</a>

  <a href="site.html">الموقع</a>
  <a href="Dashboard-Overview.html">لوحة التحكم</a>

</nav>
