<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { left: 2 * 3600 + 14 * 60 + 37 }; }
componentDidMount() { this.t = setInterval(() => this.setState({ left: Math.max(0, this.state.left - 1) }), 1000); }
componentWillUnmount() { clearInterval(this.t); }
renderVals() {
const l = this.state.left;
const pad = n => String(n).padStart(2, '0');
return { countdown: pad(Math.floor(l / 3600)) + ':' + pad(Math.floor(l % 3600 / 60)) + ':' + pad(l % 60) };
}
}
</script>
