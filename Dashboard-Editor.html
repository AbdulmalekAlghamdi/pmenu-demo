<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pmenu — المحرر الكامل</title>
<link rel="icon" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;family=El+Messiri:wght@500;700&amp;family=Reem+Kufi:wght@500;700&amp;family=Amiri:wght@400;700&amp;family=Tajawal:wght@400;700&amp;family=Cairo:wght@400;700&amp;family=Almarai:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
a{color:#FF5E13}a:hover{color:#FF7A3D}
input[type=range]{accent-color:#FF5E13;width:100%}
input[type=color]{width:44px;height:44px;border:0;border-radius:12px;padding:0;background:none;cursor:pointer}
@keyframes pm-tick{to{transform:translateX(50%)}}
@keyframes pm-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pm-fade{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes pm-spark{0%{transform:scale(.6);opacity:0}50%{opacity:1}100%{transform:scale(1.4);opacity:0}}
.pm-tick{animation:pm-tick 12s linear infinite}
.pm-bounce{animation:pm-bounce 2s ease-in-out infinite}
.pm-fade{animation:pm-fade 2.4s ease-in-out infinite}
.pm-spark{animation:pm-spark 1.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.pm-tick,.pm-bounce,.pm-fade,.pm-spark{animation:none}}
</style>
<link rel="stylesheet" href="css/demo.css">
</head>
<body class="is-page">
<template id="tpl-main">
<div dir="rtl" style="font-family: 'Readex Pro', sans-serif; color: #16140F; background: radial-gradient(1100px 520px at 90% -8%, rgba(255,94,19,.14), rgba(255,94,19,0) 60%), radial-gradient(700px 420px at 0% 100%, rgba(255,94,19,.06), rgba(255,94,19,0) 60%), #F6F4EF; min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch">
  <div style="flex: 1 1 240px; max-width: 272px"><div data-import="Sidebar" data-props='{"active": "editor"}'></div></div>

  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
      <div>
        <h1 style="margin: 0; font-size: 34px; font-weight: 600">المحرر الكامل</h1>
        <p style="margin: 6px 0 0; color: #6B675E; font-weight: 300">كل شي في منيوك تحت إيدك. اضغط على أي جزء في الجوال وعدّله</p>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
        <span style="padding: 10px 14px; border-radius: 999px; background: #FFFFFF; font-size: 13px; color: #3D3A33; box-shadow: 0 1px 2px rgba(22,20,15,.04), 0 18px 40px -18px rgba(22,20,15,.16)">{{s.changes}} تعديل · محفوظ كمسودة</span>
        <button type="button" onClick="{{reset}}" style="padding: 11px 16px; border-radius: 999px; border: 1px solid rgba(22,20,15,.14); background: #FFFFFF; font: inherit; font-size: 14px; cursor: pointer">رجّع الأصل</button>
        <button type="button" style="padding: 11px 20px; border-radius: 999px; border: 0; background: #FF5E13; color: #0A0A0A; font: inherit; font-weight: 700; cursor: pointer">انشر التعديلات</button>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <section style="flex: 1.25 1 420px; min-width: 0; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(22,20,15,.07); box-shadow: 0 1px 2px rgba(22,20,15,.04), 0 18px 40px -18px rgba(22,20,15,.16); overflow: hidden; display: flex; flex-direction: column">
        <div role="tablist" aria-label="أقسام المحرر" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; background: #F3F0EA">
          <template data-for="{{tabs}}" data-as="t">
            <button type="button" role="tab" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 7px; padding: 9px 12px; border-radius: 12px; border: 0; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; background: {{t.bg}}; color: {{t.fg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.name}}</button>
          </template>
        </div>

        <div style="padding: 22px; display: flex; flex-direction: column; gap: 18px">
          <template data-if="{{is.colors}}">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
              <template data-for="{{colorFields}}" data-as="c">
                <label style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #F6F4EF; font-size: 14px; cursor: pointer"><input type="color" value="{{c.v}}" onChange="{{c.set}}" aria-label="{{c.t}}"><span style="display: flex; flex-direction: column; gap: 2px"><span>{{c.t}}</span><span dir="ltr" style="font-family: 'Poppins', sans-serif; font-size: 11px; color: #6B675E; text-align: right">{{c.v}}</span></span></label>
              </template>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px">
              <span style="font-size: 14px; color: #3D3A33">لوحات جاهزة من شعارك</span>
              <div style="display: flex; gap: 10px; flex-wrap: wrap">
                <template data-for="{{palettes}}" data-as="pl">
                  <button type="button" onClick="{{pl.pick}}" aria-label="{{pl.name}}" style="display: flex; padding: 4px; gap: 3px; border-radius: 14px; border: 1px solid rgba(22,20,15,.12); background: #FFFFFF; cursor: pointer"><span style="width: 22px; height: 30px; border-radius: 9px 0 0 9px; background: {{pl.a}}"></span><span style="width: 22px; height: 30px; background: {{pl.b}}"></span><span style="width: 22px; height: 30px; border-radius: 0 9px 9px 0; background: {{pl.c}}"></span></button>
                </template>
              </div>
            </div>
          </template>

          <template data-if="{{is.type}}">
            <div style="display: flex; flex-direction: column; gap: 10px">
              <span style="font-size: 14px; color: #3D3A33">الخط</span>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px">
                <template data-for="{{fonts}}" data-as="f"><button type="button" onClick="{{f.pick}}" style="padding: 12px; border-radius: 14px; font-family: {{f.css}}; font-size: 16px; cursor: pointer; background: {{f.bg}}; color: {{f.fg}}; border: 1px solid {{f.border}}">{{f.label}}</button></template>
              </div>
            </div>
            <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #3D3A33">حجم الخط · {{s.scale}}%<input type="range" min="85" max="125" value="{{s.scale}}" onChange="{{num.scale}}"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6B675E">نص زر الويتر<input type="text" value="{{s.waiter}}" onChange="{{txt.waiter}}" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(22,20,15,.14); font: inherit; font-size: 14px; color: #16140F"></label>
            <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #3D3A33">استدارة الزوايا · {{s.radius}}px<input type="range" min="0" max="28" value="{{s.radius}}" onChange="{{num.radius}}"></label>
            <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #3D3A33">المسافات · {{s.gap}}px<input type="range" min="4" max="20" value="{{s.gap}}" onChange="{{num.gap}}"></label>
            <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">شكل البطاقات</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.cardStyle}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 16px; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">شكل الأزرار</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.btnStyle}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 16px; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
            </div>
          </template>

          <template data-if="{{is.logo}}">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6B675E">نص فوق الشعار<input type="text" value="{{s.above}}" onChange="{{txt.above}}" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(22,20,15,.14); font: inherit; font-size: 14px; color: #16140F"></label>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6B675E">نص تحت الشعار<input type="text" value="{{s.below}}" onChange="{{txt.below}}" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(22,20,15,.14); font: inherit; font-size: 14px; color: #16140F"></label>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">مكان الشعار</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.logoPos}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 16px; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
            </div>
            <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #3D3A33">حجم الشعار · {{s.logoSize}}px<input type="range" min="56" max="140" value="{{s.logoSize}}" onChange="{{num.logoSize}}"></label>
            <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #3D3A33">ارتفاع الهيدر · {{s.headerH}}px<input type="range" min="110" max="230" value="{{s.headerH}}" onChange="{{num.headerH}}"></label>
            <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">خلفية الشعار</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.logoBg}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 16px; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">حركة الشعار</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.logoAnim}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 16px; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #F6F4EF; font-size: 14px">صورة الغلاف خلف الشعار<button type="button" onClick="{{flip.cover}}" aria-label="صورة الغلاف" style="width: 52px; height: 30px; border-radius: 999px; border: 0; padding: 3px; background: {{sw.cover.bg}}; display: flex; justify-content: {{sw.cover.j}}; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span></button></div>
          </template>

          <template data-if="{{is.banner}}">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #F6F4EF; font-size: 14px">إظهار البنر<button type="button" onClick="{{flip.showBanner}}" aria-label="إظهار البنر" style="width: 52px; height: 30px; border-radius: 999px; border: 0; padding: 3px; background: {{sw.showBanner.bg}}; display: flex; justify-content: {{sw.showBanner.j}}; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span></button></div>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6B675E">وش ينكتب في البنر<input type="text" value="{{s.banner}}" onChange="{{txt.banner}}" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(22,20,15,.14); font: inherit; font-size: 14px; color: #16140F"></label>
            <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">شكل البنر</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.bannerStyle}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 16px; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
            </div>
            <span style="font-size: 13px; color: #6B675E">مكانه في المنيو تحدده من تبويب «الترتيب»</span>
          </template>

          <template data-if="{{is.images}}">
            <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">شكل صور الأصناف</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.imgShape}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 16px; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">فلتر موحّد للصور</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.filter}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 16px; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">طريقة عرض الأصناف</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.layout}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 16px; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
            </div>
          </template>

          <template data-if="{{is.order}}">
            <span style="font-size: 14px; color: #3D3A33">ترتيب أجزاء المنيو من فوق لتحت</span>
            <template data-for="{{orderRows}}" data-as="o">
              <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #F6F4EF; font-size: 14px">
                <span style="width: 28px; height: 28px; border-radius: 8px; background: #16140F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Poppins', sans-serif; font-size: 13px; flex: none">{{o.n}}</span>
                <span style="flex: 1 1 auto">{{o.t}}</span>
                <button type="button" onClick="{{o.up}}" aria-label="لفوق" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(22,20,15,.14); background: #FFFFFF; cursor: pointer; font-size: 16px">↑</button>
                <button type="button" onClick="{{o.down}}" aria-label="لتحت" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(22,20,15,.14); background: #FFFFFF; cursor: pointer; font-size: 16px">↓</button>
              </div>
            </template>
            <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">ترتيب الأصناف داخل القسم</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.sort}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 16px; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">شكل التبويبات</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.tabStyle}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 16px; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
            </div>
          </template>

          <template data-if="{{is.launch}}">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #F6F4EF; font-size: 14px"><span style="display: flex; flex-direction: column; gap: 2px"><span>إطلاق صنف جديد</span><span style="font-size: 12px; color: #6B675E">تشويق قبل الإطلاق، واحتفال يوم الإطلاق</span></span><button type="button" onClick="{{flip.launchOn}}" aria-label="إطلاق صنف" style="width: 52px; height: 30px; border-radius: 999px; border: 0; padding: 3px; background: {{sw.launchOn.bg}}; display: flex; justify-content: {{sw.launchOn.j}}; cursor: pointer; flex: none"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span></button></div>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6B675E">اسم الصنف الجديد<input type="text" value="{{s.launchName}}" onChange="{{txt.launchName}}" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(22,20,15,.14); font: inherit; font-size: 14px; color: #16140F"></label>
            <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">المرحلة</span>
              <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.launchMode}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 16px; border-radius: 12px; font: inherit; font-size: 14px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px">
              <div style="padding: 12px 14px; border-radius: 14px; background: #F6F4EF; font-size: 13px; display: flex; flex-direction: column; gap: 4px"><span style="color: #6B675E">موعد الإطلاق</span><strong style="font-weight: 500">الخميس ٨ مساءً</strong></div>
              <div style="padding: 12px 14px; border-radius: 14px; background: #F6F4EF; font-size: 13px; display: flex; flex-direction: column; gap: 4px"><span style="color: #6B675E">طلبوا تنبيه</span><strong style="font-family: 'Poppins', sans-serif; font-weight: 600">214</strong></div>
              <div style="padding: 12px 14px; border-radius: 14px; background: #F6F4EF; font-size: 13px; display: flex; flex-direction: column; gap: 4px"><span style="color: #6B675E">ينشر تلقائياً في</span><strong style="font-weight: 500">قصص المنيو + قوقل</strong></div>
            </div>
          </template>

          <template data-if="{{is.qr}}">
            <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
              <div style="flex: none; padding: 16px; border-radius: 22px; background: {{q.frame}}; display: flex; flex-direction: column; align-items: center; gap: 10px">
                <div style="position: relative; background: #FFFFFF; padding: 10px; border-radius: 14px">
                  <div role="img" aria-label="الباركود" style="display: grid; grid-template-columns: repeat(21, minmax(0, 1fr)); width: 147px; height: 147px">
                    <template data-for="{{q.cells}}" data-as="c"><div style="background: {{c.bg}}; border-radius: {{q.dot}}"></div></template>
                  </div>
                  <template data-if="{{s.qrLogo}}"><div style="position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 10px; background: #054026; border: 3px solid #FFFFFF; display: flex; align-items: center; justify-content: center"><img src="assets/wordmark-cream.svg" alt="" style="width: 26px; height: auto"></div></template>
                </div>
                <span style="color: {{q.capColor}}; font-size: 14px; font-weight: 600">{{s.qrCaption}}</span>
              </div>
              <div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 14px">
                <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">شكل النقاط</span>
                  <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.qrDot}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 14px; border-radius: 12px; font: inherit; font-size: 13px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; color: #3D3A33">لون الإطار</span>
                  <div style="display: flex; gap: 8px; flex-wrap: wrap"><template data-for="{{seg.qrFrame}}" data-as="o"><button type="button" onClick="{{o.pick}}" style="padding: 10px 14px; border-radius: 12px; font: inherit; font-size: 13px; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1px solid {{o.border}}">{{o.t}}</button></template></div>
                </div>
                <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6B675E">النص تحت الباركود<input type="text" value="{{s.qrCaption}}" onChange="{{txt.qrCaption}}" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(22,20,15,.14); font: inherit; font-size: 14px; color: #16140F"></label>
