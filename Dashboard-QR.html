<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pmenu — الباركود</title>
<link rel="icon" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
a{color:#FF5E13}a:hover{color:#FF7A3D}
</style>
<link rel="stylesheet" href="css/demo.css">
</head>
<body class="is-page">
<template id="tpl-main">
<div dir="rtl" style="font-family: 'Readex Pro', sans-serif; color: #16140F; background: radial-gradient(1100px 520px at 90% -8%, rgba(255,94,19,.14), rgba(255,94,19,0) 60%), radial-gradient(700px 420px at 0% 100%, rgba(255,94,19,.06), rgba(255,94,19,0) 60%), #F6F4EF; min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch">
  <div style="flex: 1 1 240px; max-width: 272px"><div data-import="Sidebar" data-props='{"active": "qr"}'></div></div>

  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
      <div>
        <h1 style="margin: 0; font-size: 34px; font-weight: 600">الباركود</h1>
        <p style="margin: 6px 0 0; color: #6B675E; font-weight: 300">رابط ثابت للأبد: غيّر المنيو والثيم كيف ما تبي بدون ما تطبع من جديد</p>
      </div>
      <span dir="ltr" style="padding: 12px 18px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(22,20,15,.08); font-family: 'Poppins', sans-serif; font-size: 14px; color: #3D3A33; box-shadow: 0 1px 2px rgba(22,20,15,.04), 0 18px 40px -18px rgba(22,20,15,.16)">pmenu.sa/wekad</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
      <section style="position: relative; flex: 3 1 480px; min-width: 0; min-height: 520px; border-radius: 28px; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box">
        <img src="assets/counter.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(2px) brightness(.55)">
        <div style="position: relative; display: flex; flex-direction: column; align-items: center">
          <div style="width: 270px; padding: 26px 24px 22px; border-radius: 26px 26px 10px 10px; background: {{frame}}; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 40px 80px rgba(0,0,0,.5)">
            <img src="{{logo}}" alt="وِكاد" style="height: 34px; width: auto">
            <div style="position: relative; background: #fff; padding: 14px; border-radius: 16px">
              <div role="img" aria-label="باركود منيو وِكاد" style="display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); width: 200px; height: 200px">
                <template data-for="{{cells}}" data-as="c"><div style="background: {{c.bg}}; border-radius: {{rad}}"></div></template>
              </div>
              <div style="position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 12px; background: #054026; border: 4px solid #fff; display: flex; align-items: center; justify-content: center"><img src="assets/wordmark-cream.svg" alt="" style="width: 32px; height: auto"></div>
            </div>
            <strong style="color: {{onFrame}}; font-size: 17px; font-weight: 500">{{caption}}</strong>
            <span style="color: {{onFrame}}; opacity: .7; font-size: 12px">طاولة ٧</span>
          </div>
          <div style="width: 300px; height: 18px; border-radius: 0 0 14px 14px; background: #2A2018; box-shadow: 0 20px 40px rgba(0,0,0,.5)"></div>
        </div>
      </section>

      <section style="flex: 2 1 340px; min-width: 0; padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(22,20,15,.07); display: flex; flex-direction: column; gap: 20px; box-shadow: 0 1px 2px rgba(22,20,15,.04), 0 18px 40px -18px rgba(22,20,15,.16)">
        <h2 style="margin: 0; font-size: 18px; font-weight: 500">تصميم الستاند</h2>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 14px; color: #3D3A33">اللون</span>
          <div style="display: flex; gap: 10px; flex-wrap: wrap">
            <template data-for="{{colors}}" data-as="k"><button type="button" onClick="{{k.pick}}" aria-label="{{k.name}}" style="width: 46px; height: 46px; border-radius: 14px; background: {{k.c}}; border: 1px solid rgba(22,20,15,.12); cursor: pointer; outline: {{k.ring}}; outline-offset: 3px"></button></template>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 14px; color: #3D3A33">شكل النقاط</span>
          <div role="group" aria-label="شكل النقاط" style="display: flex; padding: 4px; border-radius: 14px; background: #F3F0EA">
            <template data-for="{{shapes}}" data-as="sh"><button type="button" onClick="{{sh.pick}}" style="flex: 1 1 0; padding: 10px; border: 0; border-radius: 10px; font: inherit; font-size: 14px; cursor: pointer; background: {{sh.bg}}; color: {{sh.fg}}">{{sh.name}}</button></template>
          </div>
        </div>
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #3D3A33">النص على الستاند
          <input type="text" value="{{caption}}" onChange="{{setCaption}}" style="padding: 14px; border-radius: 14px; border: 1px solid rgba(22,20,15,.12); background: #F3F0EA; color: #16140F; font: inherit"></label>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: auto">
          <button type="button" style="padding: 14px; border-radius: 999px; border: 0; background: #FF5E13; color: #0A0A0A; font: inherit; font-weight: 700">ستاندات PDF للطباعة</button>
          <button type="button" style="padding: 14px; border-radius: 999px; border: 1px solid rgba(22,20,15,.16); background: transparent; color: #16140F; font: inherit">PNG · SVG</button>
        </div>
      </section>
    </div>

    <section style="padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(22,20,15,.07); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(22,20,15,.04), 0 18px 40px -18px rgba(22,20,15,.16)">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px"><h2 style="margin: 0; font-size: 18px; font-weight: 500">باركود لكل فرع وطاولة</h2><button type="button" style="padding: 10px 16px; border-radius: 999px; border: 1px dashed rgba(22,20,15,.2); background: transparent; color: #3D3A33; font: inherit">+ إضافة طاولات</button></div>
      <div style="overflow-x: auto">
        <table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 15px">
          <thead><tr style="color: #6B675E; font-size: 13px; text-align: right"><th style="padding: 10px 8px; font-weight: 400">المكان</th><th style="padding: 10px 8px; font-weight: 400">عدد الباركودات</th><th style="padding: 10px 8px; font-weight: 400">مسحات ٧ أيام</th><th style="padding: 10px 8px; font-weight: 400">أكثر طاولة</th></tr></thead>
          <tbody>
            <tr style="border-top: 1px solid rgba(22,20,15,.06)"><td style="padding: 14px 8px">الفرع الرئيسي · الكاونتر</td><td style="padding: 14px 8px">١</td><td style="padding: 14px 8px; font-family: 'Poppins', sans-serif">920</td><td style="padding: 14px 8px; color: #6B675E">—</td></tr>
            <tr style="border-top: 1px solid rgba(22,20,15,.06)"><td style="padding: 14px 8px">الفرع الرئيسي · الجلسات</td><td style="padding: 14px 8px">١٢</td><td style="padding: 14px 8px; font-family: 'Poppins', sans-serif">745</td><td style="padding: 14px 8px">طاولة ٧</td></tr>
            <tr style="border-top: 1px solid rgba(22,20,15,.06)"><td style="padding: 14px 8px">الفرع الثاني</td><td style="padding: 14px 8px">٨</td><td style="padding: 14px 8px; font-family: 'Poppins', sans-serif">660</td><td style="padding: 14px 8px">طاولة ٣</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</template>
<template id="tpl-Sidebar">
<nav dir="rtl" aria-label="لوحة التحكم" style="font-family: 'Readex Pro', sans-serif; color: #16140F; background: #FFFFFF; width: 100%; min-height: 1000px; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; border-left: 1px solid rgba(22,20,15,.07)">
  <a href="site.html" dir="ltr" style="align-self: flex-end; padding: 0 10px 20px; font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 26px; color: #16140F; text-decoration: none"><span style="color: #FF5E13">P</span>menu</a>
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #F6F4EF; border: 1px solid rgba(22,20,15,.07); margin-bottom: 14px">
    <div style="width: 38px; height: 38px; border-radius: 11px; background: #054026; display: flex; align-items: center; justify-content: center; flex: none"><img src="assets/wordmark-cream.svg" alt="" style="width: 26px; height: auto"></div>
    <div style="display: flex; flex-direction: column; min-width: 0"><strong style="font-size: 15px; font-weight: 600">وِكاد</strong><span style="font-size: 12px; color: #6B675E">٣ فروع · الباقة الفخمة</span></div>
  </div>
  <template data-for="{{items}}" data-as="it">
    <a href="{{it.href}}" style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 14px; text-decoration: none; font-size: 15px; background: {{it.bg}}; color: {{it.fg}}; font-weight: {{it.fw}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
      <span style="flex: 1 1 auto">{{it.label}}</span>
      <template data-if="{{it.badge}}"><span style="padding: 2px 8px; border-radius: 999px; background: #FF5E13; color: #0A0A0A; font-size: 11px; font-weight: 700">{{it.badge}}</span></template>
    </a>
  </template>
  <div style="margin-top: 28px; position: relative; overflow: hidden; padding: 18px; border-radius: 20px; background: #E8467C; color: #fff; display: flex; flex-direction: column; gap: 8px">
    <div aria-hidden="true" style="position: absolute; top: -30px; left: -30px; width: 100px; height: 100px; border-radius: 50%; border: 1px solid rgba(255,255,255,.45)"></div>
    <span style="font-size: 12px; opacity: .9">Season Drop</span>
    <strong style="font-size: 17px">أكتوبر الوردي مفعّل</strong>
    <span style="font-size: 13px; line-height: 1.6">يرجع ثيمك تلقائياً ١ نوفمبر</span>
  </div>
</nav>
</template>
<div class="demo-badge" role="note"><i aria-hidden="true"></i><span class="db-long">عرض تجريبي وتخيّلي فقط</span><span class="db-short">عرض تجريبي</span></div>
<div id="app"></div>
<nav class="demo-nav" aria-label="تنقل العرض">
  <a href="index.html" class="demo-brand" dir="ltr"><span>P</span>menu</a>
  <a href="index.html">القصة</a>
  <a href="site.html">الموقع</a>
  <a href="Dashboard-Overview.html">لوحة التحكم</a>
  <a href="menus.html">منيو العميل</a>
</nav>
<script src="js/morphdom.min.js"></script>
<script src="js/dc.js"></script>
<script>
DC.define('Sidebar', document.getElementById('tpl-Sidebar'), (function () {

class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'overview';
const L = [
{ k: 'overview', label: 'نبض المنيو', href: 'Dashboard-Overview.html', d: 'M3 12h4l3-8 4 16 3-8h4', badge: '' },
{ k: 'insights', label: 'رؤى ومؤشر الأسعار', href: 'Dashboard-Insights.html', d: 'M3 17l5-5 4 4 8-8M15 8h5v5', badge: 'جديد' },
{ k: 'campaigns', label: 'الحملات التسويقية', href: 'Dashboard-Campaigns.html', d: 'M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 9a3 3 0 0 1 0 6M18 6a7 7 0 0 1 0 12', badge: 'جديد' },
{ k: 'whatsapp', label: 'مساعد واتساب', href: 'Dashboard-WhatsApp.html', d: 'M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z', badge: 'جديد' },
{ k: 'menu', label: 'المنيو والصور', href: 'Dashboard-Menu.html', d: 'M4 6h16M4 12h16M4 18h10', badge: '' },
{ k: 'themes', label: 'الهوية والثيمات', href: 'Dashboard-Themes.html', d: 'M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-2 0-3h3a4 4 0 0 0 4-4c0-5-4-9-9-9zM7.5 11h.01M10.5 7h.01M15 7.5h.01', badge: '' },
{ k: 'smart', label: 'المنيو الذكي', href: 'Dashboard-Smart.html', d: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z', badge: '' },
{ k: 'google', label: 'قوقل والظهور', href: 'Dashboard-Google.html', d: 'M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z', badge: '' },
{ k: 'qr', label: 'الباركود', href: 'Dashboard-QR.html', d: 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 20h1M17 20h.01M20 14h1', badge: '' },
{ k: 'billing', label: 'الاشتراك', href: 'Dashboard-Billing.html', d: 'M2 6h20v12H2zM2 10h20', badge: '' }
];
return { items: L.map(x => ({ ...x, bg: x.k === a ? '#16140F' : 'transparent', fg: x.k === a ? '#FFFFFF' : '#3D3A33', fw: x.k === a ? '600' : '400' })) };
}
}

return Component;
})());
DC.define('main', document.getElementById('tpl-main'), (function () {

class Component extends DCLogic {
constructor(p) { super(p); this.state = { color: 0, shape: 1, caption: 'امسح وتصفّح منيو وِكاد' }; }
renderVals() {
const s = this.state;
const P = [
['أخضر وِكاد', '#054026', '#0A6B41', '#EDE6DA', 'assets/wordmark-cream.svg'],
['رملي', '#ECD7B4', '#054026', '#054026', 'assets/wordmark-green.svg'],
['أسود', '#16140F', '#0A0A0A', '#F5F5F0', 'assets/wordmark-cream.svg'],
['أبيض', '#FFFFFF', '#054026', '#054026', 'assets/wordmark-green.svg'],
['وردي أكتوبر', '#D6336C', '#9E1F4D', '#FFFFFF', 'assets/wordmark-cream.svg']
];
const cur = P[s.color];
const ink = cur[2];
const N = 25;
const finder = (r, c) => {
const pts = [[0, 0], [0, N - 7], [N - 7, 0]];
for (const p of pts) {
const y = r - p[0], x = c - p[1];
if (y >= 0 && y < 7 && x >= 0 && x < 7) return (y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4)) ? 1 : 0;
if (y >= -1 && y <= 7 && x >= -1 && x <= 7) return 0;
}
return -1;
};
let seed = 11;
const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
const cells = [];
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
const f = finder(r, c);
const mid = r >= 9 && r <= 15 && c >= 9 && c <= 15;
const on = mid ? false : (f === -1 ? rnd() > 0.5 : f === 1);
cells.push({ bg: on ? ink : 'transparent' });
}
return {
cells,
frame: cur[1], onFrame: cur[3], logo: cur[4],
rad: s.shape === 1 ? '50%' : '0',
caption: s.caption,
setCaption: (e) => this.setState({ caption: e.target.value }),
colors: P.map((p, i) => ({ name: p[0], c: p[1], ring: s.color === i ? '2px solid #FF5E13' : '0 solid transparent', pick: () => this.setState({ color: i }) })),
shapes: ['مربعات', 'دوائر'].map((n, i) => ({ name: n, bg: s.shape === i ? '#16140F' : 'transparent', fg: s.shape === i ? '#FFFFFF' : '#3D3A33', pick: () => this.setState({ shape: i }) }))
};
}
}

return Component;
})());
DC.mount('main', document.getElementById('app'));
</script>
</body>
</html>
