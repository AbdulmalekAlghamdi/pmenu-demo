    </div>

</div>

const L = [
{ k: 'overview', label: 'نبض المنيو', href: 'Dashboard-Overview.html', d: 'M3 12h4l3-8 4 16 3-8h4', badge: '' },
{ k: 'editor', label: 'المحرر الكامل', href: 'Dashboard-Editor.html', d: 'M4 20h4L19 9l-4-4L4 16zM14 6l4 4', badge: 'جديد' },

{ k: 'campaigns', label: 'الحملات', href: 'Dashboard-Campaigns.html', d: 'M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 9a3 3 0 0 1 0 6M18 6a7 7 0 0 1 0 12', badge: '' },
{ k: 'whatsapp', label: 'مساعد واتساب', href: 'Dashboard-WhatsApp.html', d: 'M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z', badge: '' },

{ k: 'themes', label: 'الهوية والثيمات', href: 'Dashboard-Themes.html', d: 'M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-2 0-3h3a4 4 0 0 0 4-4c0-5-4-9-9-9zM7.5 11h.01M10.5 7h.01M15 7.5h.01', badge: '' },
{ k: 'smart', label: 'المنيو الذكي', href: 'Dashboard-Smart.html', d: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z', badge: '' },

return { items: L.map(x => ({ ...x, bg: x.k === a ? '#16140F' : 'transparent', fg: x.k === a ? '#FFFFFF' : '#3D3A33', fw: x.k === a ? '600' : '400' })) };

DC.define('main', document.getElementById('tpl-main'), (function () {

class Component extends DCLogic {
constructor(p) { super(p); this.state = { tpl: 0, dot: 'round', eye: 'soft', c1: '#054026', c2: '#0A6B41', eyeC: '#054026', frame: '#054026', logo: true, caption: 'امسح وتصفّح منيو وِكاد', smart: { 0: true, 1: true, 2: false, 3: true } }; }
renderVals() {
const s = this.state;
const hex = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const light = (h) => { const c = hex(h); return (c[0] * 299 + c[1] * 587 + c[2] * 114) / 1000 > 150; };
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return 'rgb(' + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',') + ')'; };
const N = 21; let seed = 11; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
const inEye = (r, c) => (r < 8 && c < 8) || (r < 8 && c > N - 9) || (r > N - 9 && c < 8);
const mid = (r, c) => s.logo && r >= 8 && r <= 12 && c >= 8 && c <= 12;
const cells = [];
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const on = !inEye(r, c) && !mid(r, c) && rnd() > .5; cells.push({ bg: on ? mix(s.c1, s.c2, (r + c) / (2 * N)) : 'transparent' }); }
const TP = [
{ t: 'ستاند طاولة', d: 'M6 3h12v14H6zM4 21h16', w: '280px', pad: '24px 22px 20px', rad: '26px 26px 10px 10px', rot: '0deg', head: true, big: false, table: true, base: true },
{ t: 'ستيكر الباب', d: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', w: '300px', pad: '34px 28px', rad: '50%', rot: '-4deg', head: true, big: false, table: false, base: false },
{ t: 'كرت الكاشير', d: 'M3 6h18v12H3z', w: '330px', pad: '20px', rad: '18px', rot: '3deg', head: true, big: false, table: false, base: false },
{ t: 'بوستر', d: 'M5 2h14v20H5z', w: '300px', pad: '30px 24px', rad: '6px', rot: '0deg', head: true, big: true, table: false, base: false },
{ t: 'ملصق NFC', d: 'M6 8a6 6 0 0 1 0 8M10 6a10 10 0 0 1 0 12M14 4a14 14 0 0 1 0 16', w: '250px', pad: '22px', rad: '40px', rot: '0deg', head: true, big: false, table: false, base: false }
];
