<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pmenu — الاشتراك</title>
<link rel="icon" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F4EF}
a{color:#FF5E13}a:hover{color:#FF7A3D}
</style>
<link rel="stylesheet" href="css/demo.css">
</head>
<body class="is-page">
<template id="tpl-main">
<div dir="rtl" style="font-family: 'Readex Pro', sans-serif; color: #16140F; background: radial-gradient(1100px 520px at 90% -8%, rgba(255,94,19,.14), rgba(255,94,19,0) 60%), radial-gradient(700px 420px at 0% 100%, rgba(255,94,19,.06), rgba(255,94,19,0) 60%), #F6F4EF; min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch">
  <div style="flex: 1 1 240px; max-width: 272px"><div data-import="Sidebar" data-props='{"active": "billing"}'></div></div>

  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <h1 style="margin: 0; font-size: 34px; font-weight: 600">الاشتراك</h1>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
      <section style="position: relative; overflow: hidden; flex: 3 1 460px; min-width: 0; padding: 32px; border-radius: 28px; background: #FF5E13; color: #0A0A0A; display: flex; flex-direction: column; gap: 22px">
        <div aria-hidden="true" style="position: absolute; top: -90px; left: -90px; width: 280px; height: 280px; border-radius: 50%; border: 1px solid rgba(10,10,10,.25)"></div>
        <div aria-hidden="true" style="position: absolute; bottom: -60px; left: 60px; width: 160px; height: 160px; border-radius: 50%; background: #0A0A0A"></div>
        <div style="position: relative; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 500">باقتك الحالية</span><strong style="font-size: 40px; font-weight: 700">الفخمة</strong></div>
          <span style="padding: 8px 14px; border-radius: 999px; background: #0A0A0A; color: #FF5E13; font-size: 13px; font-weight: 600">فعّالة</span>
        </div>
        <div style="position: relative; display: flex; align-items: baseline; gap: 8px"><span style="font-family: 'Poppins', sans-serif; font-size: 52px; font-weight: 700">1,199</span><span>ريال / سنوياً</span></div>
        <div style="position: relative; display: flex; flex-wrap: wrap; gap: 24px; font-size: 14px">
          <div style="display: flex; flex-direction: column; gap: 4px"><span style="opacity: .75">التجديد</span><strong>١٩ أكتوبر ٢٠٢٧</strong></div>
          <div style="display: flex; flex-direction: column; gap: 4px"><span style="opacity: .75">طريقة الدفع</span><strong>مدى •••• 4821</strong></div>
          <div style="display: flex; flex-direction: column; gap: 4px"><span style="opacity: .75">التجديد التلقائي</span><strong>مفعّل</strong></div>
        </div>
      </section>

      <section style="flex: 2 1 320px; min-width: 0; padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(22,20,15,.07); display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 2px rgba(22,20,15,.04), 0 18px 40px -18px rgba(22,20,15,.16)">
        <h2 style="margin: 0; font-size: 18px; font-weight: 500">استخدامك</h2>
        <template data-for="{{usage}}" data-as="u">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; justify-content: space-between; font-size: 14px"><span>{{u.t}}</span><span style="color: #6B675E; font-family: 'Poppins', sans-serif">{{u.v}}</span></div>
            <div style="height: 8px; border-radius: 99px; background: #ECE8E0"><div style="height: 8px; border-radius: 99px; background: {{u.c}}; width: {{u.w}}"></div></div>
          </div>
        </template>
      </section>
    </div>

    <section style="padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(22,20,15,.07); display: flex; flex-wrap: wrap; gap: 22px; align-items: center; box-shadow: 0 1px 2px rgba(22,20,15,.04), 0 18px 40px -18px rgba(22,20,15,.16)">
      <div style="display: flex; gap: 10px; flex: none">
        <img src="assets/mango-cheesecake.jpg" alt="" style="width: 76px; height: 76px; border-radius: 18px; object-fit: cover">
        <img src="assets/smores.jpg" alt="" style="width: 76px; height: 76px; border-radius: 18px; object-fit: cover">
      </div>
      <div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 6px">
        <strong style="font-size: 18px; font-weight: 500">طلب التصميم الخاص: «طابع نجدي بألوان وِكاد»</strong>
        <span style="font-size: 14px; color: #6B675E">المصمم يشتغل عليه الحين · التسليم المتوقع خلال [المدة]</span>
        <div style="display: flex; gap: 6px; padding-top: 6px">
          <span style="flex: 1 1 0; height: 6px; border-radius: 99px; background: #FF5E13"></span><span style="flex: 1 1 0; height: 6px; border-radius: 99px; background: #FF5E13"></span><span style="flex: 1 1 0; height: 6px; border-radius: 99px; background: #E3DED4"></span><span style="flex: 1 1 0; height: 6px; border-radius: 99px; background: #E3DED4"></span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6B675E"><span>استلام الطلب</span><span>التصميم</span><span>مراجعتك</span><span>النشر</span></div>
      </div>
      <a href="Dashboard-Themes.html" style="padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(22,20,15,.16); color: #16140F; text-decoration: none">التفاصيل</a>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 16px">
      <section style="flex: 1 1 360px; min-width: 0; padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(22,20,15,.07); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(22,20,15,.04), 0 18px 40px -18px rgba(22,20,15,.16)">
        <h2 style="margin: 0; font-size: 18px; font-weight: 500">قارن الباقات</h2>
        <div role="group" aria-label="الباقة" style="display: flex; padding: 4px; border-radius: 14px; background: #F3F0EA">
          <template data-for="{{plans}}" data-as="p"><button type="button" onClick="{{p.pick}}" style="flex: 1 1 0; padding: 12px; border: 0; border-radius: 10px; font: inherit; cursor: pointer; background: {{p.bg}}; color: {{p.fg}}">{{p.name}} · {{p.price}}</button></template>
        </div>
        <template data-for="{{features}}" data-as="f">
          <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(22,20,15,.06); font-size: 14px"><span style="color: #3D3A33">{{f.t}}</span><span style="color: {{f.c}}">{{f.v}}</span></div>
        </template>
      </section>
      <section style="flex: 1 1 360px; min-width: 0; padding: 24px; border-radius: 28px; background: #FFFFFF; border: 1px solid rgba(22,20,15,.07); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(22,20,15,.04), 0 18px 40px -18px rgba(22,20,15,.16)">
        <h2 style="margin: 0 0 4px; font-size: 18px; font-weight: 500">الفواتير</h2>
        <template data-for="{{invoices}}" data-as="iv">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px; border-radius: 16px; background: #F3F0EA">
            <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">{{iv.t}}</span><span style="font-size: 12px; color: #6B675E">{{iv.d}} · فاتورة إلكترونية متوافقة مع زاتكا</span></div>
            <div style="display: flex; align-items: center; gap: 10px"><strong style="font-family: 'Poppins', sans-serif">{{iv.a}}</strong><button type="button" aria-label="تحميل الفاتورة" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(22,20,15,.1); background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D3A33" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"></path></svg></button></div>
          </div>
        </template>
      </section>
    </div>
  </main>
</div>
</template>
<template id="tpl-Sidebar">
<nav dir="rtl" aria-label="لوحة التحكم" style="font-family: 'Readex Pro', sans-serif; color: #16140F; background: #FFFFFF; width: 100%; min-height: 1000px; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; border-left: 1px solid rgba(22,20,15,.07)">
  <a href="site.html" dir="ltr" style="align-self: flex-end; padding: 0 10px 20px; font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 26px; color: #16140F; text-decoration: none"><span style="color: #FF5E13">P</span>menu</a>
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #F6F4EF; border: 1px solid rgba(22,20,15,.07); margin-bottom: 14px">
    <div style="width: 38px; height: 38px; border-radius: 11px; background: #054026; display: flex; align-items: center; justify-content: center; flex: none"><img src="assets/wordmark-cream.svg" alt="" style="width: 26px; height: auto"></div>
    <div style="display: flex; flex-direction: column; min-width: 0"><strong style="font-size: 15px; font-weight: 600">وِكاد</strong><span style="font-size: 12px; color: #6B675E">٣ فروع · الباقة الفخمة</span></div>
  </div>
  <template data-for="{{items}}" data-as="it">
    <a href="{{it.href}}" style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 14px; text-decoration: none; font-size: 15px; background: {{it.bg}}; color: {{it.fg}}; font-weight: {{it.fw}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
      <span style="flex: 1 1 auto">{{it.label}}</span>
      <template data-if="{{it.badge}}"><span style="padding: 2px 8px; border-radius: 999px; background: #FF5E13; color: #0A0A0A; font-size: 11px; font-weight: 700">{{it.badge}}</span></template>
    </a>
  </template>
  <div style="margin-top: 28px; position: relative; overflow: hidden; padding: 18px; border-radius: 20px; background: #E8467C; color: #fff; display: flex; flex-direction: column; gap: 8px">
    <div aria-hidden="true" style="position: absolute; top: -30px; left: -30px; width: 100px; height: 100px; border-radius: 50%; border: 1px solid rgba(255,255,255,.45)"></div>
    <span style="font-size: 12px; opacity: .9">Season Drop</span>
    <strong style="font-size: 17px">أكتوبر الوردي مفعّل</strong>
    <span style="font-size: 13px; line-height: 1.6">يرجع ثيمك تلقائياً ١ نوفمبر</span>
  </div>
</nav>
</template>
<div class="demo-badge" role="note"><i aria-hidden="true"></i><span class="db-long">عرض تجريبي وتخيّلي فقط</span><span class="db-short">عرض تجريبي</span></div>
<div id="app"></div>
<nav class="demo-nav" aria-label="تنقل العرض">
  <a href="index.html" class="demo-brand" dir="ltr"><span>P</span>menu</a>
  <a href="index.html">القصة</a>
  <a href="site.html">الموقع</a>
  <a href="Dashboard-Overview.html">لوحة التحكم</a>
  <a href="menus.html">منيو العميل</a>
</nav>
<script src="js/morphdom.min.js"></script>
<script src="js/dc.js"></script>
<script>
DC.define('Sidebar', document.getElementById('tpl-Sidebar'), (function () {

class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'overview';
const L = [
{ k: 'overview', label: 'نبض المنيو', href: 'Dashboard-Overview.html', d: 'M3 12h4l3-8 4 16 3-8h4', badge: '' },
{ k: 'insights', label: 'رؤى ومؤشر الأسعار', href: 'Dashboard-Insights.html', d: 'M3 17l5-5 4 4 8-8M15 8h5v5', badge: 'جديد' },
{ k: 'campaigns', label: 'الحملات التسويقية', href: 'Dashboard-Campaigns.html', d: 'M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 9a3 3 0 0 1 0 6M18 6a7 7 0 0 1 0 12', badge: 'جديد' },
{ k: 'whatsapp', label: 'مساعد واتساب', href: 'Dashboard-WhatsApp.html', d: 'M21 12a9 9 0 0 1-13.5 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z', badge: 'جديد' },
{ k: 'menu', label: 'المنيو والصور', href: 'Dashboard-Menu.html', d: 'M4 6h16M4 12h16M4 18h10', badge: '' },
{ k: 'themes', label: 'الهوية والثيمات', href: 'Dashboard-Themes.html', d: 'M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-2 0-3h3a4 4 0 0 0 4-4c0-5-4-9-9-9zM7.5 11h.01M10.5 7h.01M15 7.5h.01', badge: '' },
{ k: 'smart', label: 'المنيو الذكي', href: 'Dashboard-Smart.html', d: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z', badge: '' },
{ k: 'google', label: 'قوقل والظهور', href: 'Dashboard-Google.html', d: 'M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z', badge: '' },
{ k: 'qr', label: 'الباركود', href: 'Dashboard-QR.html', d: 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM20 20h1M17 20h.01M20 14h1', badge: '' },
{ k: 'billing', label: 'الاشتراك', href: 'Dashboard-Billing.html', d: 'M2 6h20v12H2zM2 10h20', badge: '' }
];
return { items: L.map(x => ({ ...x, bg: x.k === a ? '#16140F' : 'transparent', fg: x.k === a ? '#FFFFFF' : '#3D3A33', fw: x.k === a ? '600' : '400' })) };
}
}

return Component;
})());
DC.define('main', document.getElementById('tpl-main'), (function () {

class Component extends DCLogic {
constructor(p) { super(p); this.state = { plan: 1 }; }
renderVals() {
const p = this.state.plan;
const F = [
['الفروع', 'فرع واحد', 'غير محدود'],
['منيو QR ثنائي اللغة', '✓', '✓'],
['ثيمات المواسم', '✓', '✓'],
['بصمة الهوية من الشعار', '—', '✓'],
['استوديو الصور', '٣٠ صورة / شهر', 'غير محدود'],
['مزامنة فودكس', '—', '✓'],
['قوقل ماب ومحركات البحث', 'أساسي', 'كامل + كلمات ذكية'],
['المنيو الذكي وتجارب A/B', '—', '✓']
];
return {
plans: [['العادية', '999'], ['الفخمة', '1,199']].map((x, i) => ({ name: x[0], price: x[1], bg: p === i ? '#16140F' : 'transparent', fg: p === i ? '#FFFFFF' : '#3D3A33', pick: () => this.setState({ plan: i }) })),
features: F.map(f => ({ t: f[0], v: f[1 + p], c: f[1 + p] === '—' ? '#A39F95' : '#16140F' })),
usage: [
{ t: 'الفروع', v: '3 / ∞', w: '30%', c: '#FF5E13' },
{ t: 'الأصناف', v: '31 / ∞', w: '40%', c: '#FF5E13' },
{ t: 'صور الاستوديو هذا الشهر', v: '48', w: '62%', c: '#FF5E13' },
{ t: 'تجارب A/B نشطة', v: '2 / 5', w: '40%', c: '#178048' }
],
invoices: [
{ t: 'اشتراك الباقة الفخمة', d: '١٩ أكتوبر ٢٠٢٦', a: '1,199' },
{ t: 'التصميم الخاص', d: '١٢ أكتوبر ٢٠٢٦', a: '[المبلغ]' },
{ t: 'اشتراك الباقة العادية', d: '١٩ أكتوبر ٢٠٢٥', a: '999' }
]
};
}
}

return Component;
})());
DC.mount('main', document.getElementById('app'));
</script>
</body>
</html>
